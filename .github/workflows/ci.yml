name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm may record the @lumine-code git forks with ssh URLs, but the runner
      # has no ssh key, so rewrite them to anonymous HTTPS (the forks are public).
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Validate portable ZIP extraction
        run: npm run check:zip
      - name: Validate portable XZ extraction
        run: npm run check:xz
      - name: Validate bounded installer downloads
        run: npm run check:fetch
      - name: Validate scoped Node process arguments
        run: npm run check:node-launch
      - name: Audit package dependencies
        run: npm audit --audit-level=moderate
      - name: Check package contents
        run: npm pack --dry-run

  integration:
    # Run the Jasmine spec suite inside a real Lumine build; the specs exercise
    # the editor runtime (text editors, config, and service wiring).
    name: Lumine integration specs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      LUMINE_JASMINE_REPORTER: list
    steps:
      - uses: actions/checkout@v7
        with:
          path: ide
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - name: Install Linux build and headless-display dependencies
        if: runner.os == 'Linux'
        run: |
          # A third-party repository on the runner image answering 403 must not
          # fail the job: the lists this actually needs still fetched, and the
          # install below stays strict, so a missing package still stops us.
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      # npm records the @lumine-code git forks with ssh URLs, but the runner has
      # no ssh key, so rewrite them to anonymous HTTPS (the forks are public).
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install package dependencies
        working-directory: ide
        run: npm ci --ignore-scripts
      - name: Install declared spec packages
        run: node lumine/script/install-spec-packages.js --package ide --home "$RUNNER_TEMP/lumine-spec-home" --github-env "$GITHUB_ENV"
      - name: Install adapter test dependencies
        run: |
          node -e 'const fs = require("node:fs"); const path = require("node:path"); fs.symlinkSync(path.resolve("ide"), path.join(process.env.LUMINE_HOME, "packages", "ide"), "junction");'
          for adapter in ide-basedpyright ide-eslint ide-graphql ide-typescript ide-vue; do
            npm --prefix "$LUMINE_HOME/packages/$adapter" ci --ignore-scripts
          done
          npm --prefix "$LUMINE_HOME/packages/ide-eslint" run pretest
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Download the Electron binary
        working-directory: lumine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node script/install-electron.js
      - name: Rebuild native modules for Electron
        working-directory: lumine
        run: npm run build
      - name: Run IDE and language adapter specs against the candidate client
        working-directory: lumine
        timeout-minutes: 30
        run: |
          export TEMP="$RUNNER_TEMP/ide-suite-temp"
          export TMP="$TEMP"
          export TMPDIR="$TEMP"
          mkdir -p "$TEMP"
          export LUMINE_TEST_PACKAGES="ide $LUMINE_TEST_PACKAGES"
          spec_home="$LUMINE_HOME"
          if [ "$RUNNER_OS" = Windows ]; then
            spec_home="$(cygpath -u "$spec_home")"
          fi
          run_specs() {
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run --auto-servernum npm start -- --test "$1"
            else
              npm start -- --test "$1"
            fi
          }
          run_specs ../ide/spec
          export LUMINE_TEST_PACKAGES=ide
          for adapter in ide-basedpyright ide-eslint ide-graphql ide-typescript ide-vue; do
            git -C "$spec_home/packages/$adapter" log -1 --format="$adapter %H"
            run_specs "$spec_home/packages/$adapter/spec"
          done
